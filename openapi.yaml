openapi: 3.1.0
info:
  title: http-queue API
  version: "1.0.0"
  description: |
    Durable HTTP queue engine backed by BadgerDB.

    Admin endpoints use HTTP Basic authentication.
    Worker endpoints use Bearer tokens returned by `POST /workers`.
servers:
  - url: http://localhost:8080
tags:
  - name: Admin
  - name: Worker
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        Used by admin endpoints. Invalid or missing credentials return the same
        generic `401 Unauthorized` plain-text response.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Used by worker endpoints. The bearer token is the opaque token returned
        once by `POST /workers`; it is not a JWT. Invalid, missing, or stale
        tokens return the same generic `401 Unauthorized` plain-text response.
  parameters:
    QueueName:
      name: queue
      in: path
      required: true
      description: Queue name. Must not contain `:` or `/`.
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      description: Job ULID.
      schema:
        type: string
    WorkerID:
      name: id
      in: path
      required: true
      description: Worker ULID.
      schema:
        type: string
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    ScheduleJobRequest:
      type: object
      additionalProperties: false
      properties:
        payload: {}
        ttl:
          type:
            - integer
            - "null"
          minimum: 1
          description: Optional job TTL in seconds. `null` or omission means no TTL.
    ScheduleJobResponse:
      type: object
      additionalProperties: false
      required: [id, queue, status, created]
      properties:
        id:
          type: string
        queue:
          type: string
        status:
          type: string
          enum: [pending]
        created:
          type: string
          format: date-time
        ttl:
          type:
            - integer
            - "null"
          minimum: 1
    RegisterWorkerResponse:
      type: object
      additionalProperties: false
      required: [worker_id, token]
      properties:
        worker_id:
          type: string
        token:
          type: string
          description: Opaque bearer token returned only once at worker registration.
    ClaimedJobResponse:
      type: object
      additionalProperties: false
      required: [id, queue, payload, attempts]
      properties:
        id:
          type: string
        queue:
          type: string
        payload: {}
        attempts:
          type: integer
          minimum: 1
  headers:
    NextPollSeconds:
      description: Advisory whole-number seconds to wait before polling the same queue again.
      schema:
        type: integer
        minimum: 1
  responses:
    UnauthorizedText:
      description: Generic unauthorized response with no credential failure details.
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /queues/{queue}/jobs:
    post:
      tags: [Admin]
      summary: Schedule a new job
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/QueueName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleJobRequest"
            examples:
              noTTL:
                summary: Schedule without TTL
                value:
                  payload:
                    orderId: 42
                    action: process
              withTTL:
                summary: Schedule with TTL
                value:
                  payload:
                    orderId: 42
                    action: process
                  ttl: 600
      responses:
        "201":
          description: Job scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
  /workers:
    post:
      tags: [Admin]
      summary: Register a worker
      description: |
        Registers a worker and returns its worker ID plus the opaque bearer token
        used for all worker endpoints. The token is only returned by this response,
        so callers must persist it themselves.
      security:
        - BasicAuth: []
      responses:
        "201":
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterWorkerResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /workers/{id}:
    delete:
      tags: [Admin]
      summary: Deregister a worker and requeue its reserved jobs
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkerID"
      responses:
        "204":
          description: Worker deregistered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
  /queues/{queue}/next:
    get:
      tags: [Worker]
      summary: Claim the next pending job
      description: |
        Returns `204 No Content` when the queue is empty.

        Every successful response also includes the advisory `X-Next-Poll-Seconds`
        header. The value is computed from the number of recently active workers
        for that queue as `ceil(base_interval * sqrt(active_workers))`, clamped
        by the configured minimum and maximum intervals. The activity tracker is
        in-memory and resets on process restart.

        Authenticate with `Authorization: Bearer <token>` using the opaque token
        returned once by `POST /workers`.

        TTL semantics:
        - expired pending jobs are deleted and skipped
        - jobs already claimed before TTL expiry may still be acknowledged later
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueueName"
      responses:
        "200":
          description: Job claimed
          headers:
            X-Next-Poll-Seconds:
              $ref: "#/components/headers/NextPollSeconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedJobResponse"
        "204":
          description: Queue is empty
          headers:
            X-Next-Poll-Seconds:
              $ref: "#/components/headers/NextPollSeconds"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /jobs/{id}/ack:
    post:
      tags: [Worker]
      summary: Acknowledge a claimed job
      description: |
        A claimed job can still be acknowledged successfully even if its wall-clock TTL has elapsed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "204":
          description: Job acknowledged and removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
  /jobs/{id}/nack:
    post:
      tags: [Worker]
      summary: Negative-acknowledge a claimed job
      description: |
        Requeues the job unless one of the following is true:
        - `attempts >= MAX_ATTEMPTS`, in which case the job moves to dead-letter
        - the job TTL has elapsed, in which case the job is deleted
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "204":
          description: Job requeued, dead-lettered, or deleted due to TTL
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedText"
