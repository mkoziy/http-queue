{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}http-queue admin{{end}}</title>
  <style>
:root {
  --bg: #f2f2f0;
  --panel: #f8f8f6;
  --panel-2: #efefec;
  --text: #171717;
  --muted: #5d5d58;
  --line: #d6d6d1;
  --line-strong: #a9a9a2;
  --mono: "SFMono-Regular", ui-monospace, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--text);
  background: var(--bg);
}
#app {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 20px 40px;
}
.hero {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 18px 20px 20px;
  margin-bottom: 16px;
}
.eyebrow {
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
}
.eyebrow a { color: var(--muted); }
h1 { margin: 0; font-weight: 600; font-size: clamp(24px, 4vw, 40px); line-height: 0.96; letter-spacing: -0.04em; }
h2 { margin: 0 0 14px; font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 12px;
}
.span-8 { grid-column: span 8; }
.span-4 { grid-column: span 4; }
.span-12 { grid-column: span 12; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 16px;
}
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11px; line-height: 1.45; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  font-size: 10px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  padding: 0 16px 7px 0;
  border-bottom: 1px solid var(--line-strong);
}
tbody td {
  padding: 9px 16px 9px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  vertical-align: top;
  word-break: break-all;
}
tbody tr:last-child td { border-bottom: none; }
.empty-row td { color: var(--muted); word-break: normal; }
.pager {
  margin-top: 14px;
  font-family: var(--mono);
  font-size: 11px;
  display: flex;
  gap: 16px;
}
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.tab {
  font-family: var(--mono);
  font-size: 11px;
  padding: 6px 14px;
  border: 1px solid transparent;
  margin-bottom: -1px;
  color: var(--muted);
  white-space: nowrap;
}
.tab.active {
  border-color: var(--line);
  border-bottom-color: var(--panel);
  color: var(--text);
  background: var(--panel);
}
.tab:hover:not(.active) { color: var(--text); }
.queue-list { margin-top: 4px; }
.queue-item {
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12px;
}
.queue-item:last-child { border-bottom: none; }
.empty-state { color: var(--muted); font-size: 12px; margin-top: 8px; }
@media (max-width: 920px) {
  .span-8, .span-4, .span-12 { grid-column: span 12; }
  #app { padding: 14px 12px 24px; }
}
  </style>
</head>
<body>
<div id="app">
  {{block "content" .}}{{end}}
</div>
</body>
</html>
{{end}}
